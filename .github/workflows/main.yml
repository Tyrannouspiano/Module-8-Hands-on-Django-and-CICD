name: CI/CD Pipeline for CSC325 Django Project

on:
  push:
    branches:
      - main

jobs: 
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install -r csc325Mod8Project/requirements.txt

      - name: Run tests
        working-directory: csc325Mod8Project
        env:
          DJANGO_DEBUG: "true"
        run: python manage.py test

      - name: Deploy
        run: |
          echo "Deploying the application..."
          #Add deployment commands here